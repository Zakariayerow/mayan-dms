{% load i18n %}

{% load smart_settings_tags %}

{% smart_settings_check_changed as settings_changed %}
{% if settings_changed %}
    <div class="alert alert-dismissible alert-warning">
        <button aria-label="{% trans 'Close' %}" class="btn-close" data-bs-dismiss="alert" type="button"></button>
        <p><strong>{% trans 'Warning' %}</strong> {% trans 'Settings updated. Save and restart your installation for changes to take effect.' %}</p>
    </div>
{% endif %}
