{% load i18n %}

{% load appearance_bootstrap_tags %}
{% load common_tags %}

{% appearance_bootstrap_color_mode_get as appearance_color_mode %}

<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1" name="viewport" />
{% if appearance_color_mode %}<meta content="{{ appearance_color_mode.name }}" name="color-scheme" />{% endif %}
{% if appearance_color_mode.theme_color %}<meta content="{{ appearance_color_mode.theme_color }}" name="theme-color" />{% endif %}
<meta content="telephone=no" name="format-detection" />
<meta content="{% common_project_information '__title__' %}" name="application-name" />
<meta content="{% common_project_information '__title__' %}" name="apple-mobile-web-app-title" />
<meta content="{% common_project_information '__author__' %}" name="author" />
<meta content="{% common_project_information '__copyright__' %}" name="copyright" />
<meta content="{% common_project_information '__description__' as project_description %}{% trans project_description %}" name="description" />
<link href="{% common_project_information '__license_url__' %}" rel="license" title="{% common_project_information '__license__' %}" />
