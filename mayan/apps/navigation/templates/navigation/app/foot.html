<script>
    'use strict';

    jQuery(document).ready(function() {
        $('body').on('change', '#navigation-sort-field-select', function (event) {
            const $this = $(this);

            let url = new URL(
                window.location.hash.substring(1), window.location
            )
            url.search = $this.val();

            partialNavigation.setLocation(url.pathname + url.search);
        });
    });
</script>
