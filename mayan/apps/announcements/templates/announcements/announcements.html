{% load i18n %}

{% if announcements %}
    <div class="row">
        <div class="col-12 col-sm-10 offset-sm-1 col-md-10 offset-md-1 col-lg-8 offset-lg-2">
            <div class="card border-primary">
                <div class="card-header bg-primary text-white">
                    <h3 class="mayan-h3 mb-0">{% trans 'Announcements' %}</h3>
                </div>
                <div class="card-body">
                    {% for announcement in announcements %}
                        <ul class="list-group">
                            <li class="list-group-item">
                                <h4 class="mayan-h4 mb-1">{{ announcement.label }}</h4>
                                <p class="mb-1">{{ announcement.text | linebreaks }}</p>
                            </li>
                        </ul>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endif %}
